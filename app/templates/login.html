{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card mt-5">
            <div class="card-header" style="background-color: #B85D19; color: white;">
                <h4 class="text-center"><i class="fas fa-sign-in-alt"></i> Login</h4>
            </div>
            <div class="card-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100" style="background-color: #B85D19; border-color: #B85D19;">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </form>
                <div class="text-center mt-3">
                    <p>Não tem conta? <a href="{% url 'cadastro' %}" style="color: #B85D19;">Cadastre-se</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
